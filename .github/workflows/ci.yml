name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor and the current release. Between them sit the features this
        # codebase actually uses; anything that breaks on one and not the other
        # is a version assumption worth catching here rather than in a report.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e .
          # The dev group, not just pytest: jsonschema is what holds the SARIF
          # report to the published 2.1.0 schema, and without it those tests
          # skip themselves. A validation that quietly does not run is worse
          # than none, because the badge still passes.
          uv pip install --group dev

      # Lint once, not once per Python version: ruff's findings do not depend
      # on the interpreter running the tests.
      - name: Lint
        if: matrix.python == '3.13'
        run: .venv/bin/python -m ruff check .

      # Most of the suite runs without noir; the end-to-end tests skip
      # themselves when it is absent, which is why it is not installed here,
      # so a missing release never blocks a pull request. The integration
      # against a real noir build runs in noir.yml, where a failure means
      # "noir moved" rather than "this pull request is bad".
      - name: Test
        run: .venv/bin/python -m pytest tests/ -q
