# The one workflow that installs noir.
#
# ci.yml deliberately does not: the end-to-end tests skip themselves when noir
# is absent, so a pull request never waits on a noir release. The cost of that
# is a green badge which proves nothing about the only thing alibi does --
# read noir's JSON, its `list techs` catalog, and its tagger output. Every one
# of those is a contract with a program released on its own schedule, and it
# can break without a line of this repository changing.
#
# So the integration runs here instead, on a schedule, where a failure means
# "noir moved" rather than "this pull request is bad".
name: noir integration

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday morning UTC
  workflow_dispatch:
    inputs:
      noir_version:
        description: "noir version to test against (default: latest release)"
        required: false
  push:
    paths:
      # The files that encode assumptions about noir specifically.
      - "src/alibi/collect.py"
      - "src/alibi/views.yml"
      - "tests/test_end_to_end.py"
      - ".github/workflows/noir.yml"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          # There is no uv.lock: CI installs unlocked so that an upstream
          # release breaking this package shows up here rather than in a bug
          # report. pyproject.toml is what decides the install, so it is what
          # the cache should be keyed on.
          cache-dependency-glob: "pyproject.toml"

      # The linux asset is a bare executable named for its release
      # (noir-v1.3.0-linux-x86_64), not an archive and not called `noir`.
      - name: Install noir
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ inputs.noir_version }}
        run: |
          tag="${PINNED:-$(gh release view --repo owasp-noir/noir --json tagName -q .tagName)}"
          case "$tag" in v*) ;; *) tag="v$tag" ;; esac   # accept 1.3.0 or v1.3.0
          echo "noir $tag"
          gh release download "$tag" --repo owasp-noir/noir \
            --pattern '*-linux-x86_64' --dir /tmp/noir --clobber
          binary=$(find /tmp/noir -maxdepth 1 -type f | head -1)
          if [ -z "$binary" ]; then
            echo "::error::noir $tag has no linux-x86_64 asset"
            exit 1
          fi
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$binary" "$HOME/.local/bin/noir"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/noir" --version

      - name: Install alibi
        run: |
          uv venv --python 3.13
          uv pip install -e .
          uv pip install --group dev

      # -p no:randomly is not needed; what matters is that the noir-dependent
      # tests are the point of this job, so a skip is a failure here.
      - name: The end-to-end tests must run, not skip
        run: |
          .venv/bin/python -m pytest tests/ -q -rs
          if .venv/bin/python -m pytest tests/test_end_to_end.py -q -rs 2>&1 | grep -q "noir is not installed"; then
            echo "::error::end-to-end tests skipped -- noir was not found"
            exit 1
          fi

      # The view map defaults anything unlisted to `code`, which is wrong for a
      # specification analyzer noir added after views.yml was last touched.
      # `doctor` exits non-zero on exactly that drift.
      - name: The view map still matches this noir build
        run: .venv/bin/alibi doctor
