[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noir-alibi"
version = "0.1.0"
description = "Cross-check the views of your attack surface and find the endpoints that cannot corroborate each other"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "hahwul", email = "hahwul@gmail.com" },
    { name = "ksg97031", email = "ksg97031@gmail.com" },
]
keywords = ["security", "api", "shadow-api", "attack-surface", "noir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/owasp-noir/alibi"
Issues = "https://github.com/owasp-noir/alibi/issues"

[project.scripts]
alibi = "alibi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alibi"]

[dependency-groups]
# jsonschema holds the SARIF report to the published 2.1.0 schema. Nothing in
# this repository reads SARIF, so without it a malformed document passes review
# and is rejected on upload.
dev = ["pytest>=8.0", "jsonschema>=4.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# The longest lines here are prose in docstrings and help text, where a
# reflow costs more than it returns.
line-length = 100
target-version = "py311"
# Fixtures are input for noir, not code this project ships. Ruff had already
# deleted an unused import from a Flask fixture -- rewriting the very thing a
# test asserts noir reads out of it.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# E,F,W are the pyflakes/pycodestyle core; I sorts imports; UP keeps the
# syntax at the 3.11 floor this package declares; B catches the bugs a linter
# can actually see.
select = ["E", "F", "W", "I", "UP", "B"]
