# What it means when the views disagree.
#
# Each rule is a predicate over which views vouched for an endpoint. `present`
# and `absent` are both required to hold.
#
# `needs` is the guard that keeps this tool usable. A scan with no API contract
# anywhere in it would otherwise report every single endpoint as an undocumented
# shadow API -- hundreds of findings that say nothing except "you did not point
# alibi at your docs". A rule only runs when every view it reasons about was
# actually represented in the scan.

severities: [info, low, medium, high, critical]

rules:
  - id: SHADOW
    name: Shadow API
    summary: Implemented, but no contract describes it
    present: [code]
    absent: [doc]
    needs: [code, doc]
    severity: medium
    detail: >-
      The endpoint exists in the codebase and will answer requests, but no
      OpenAPI, GraphQL, WSDL or other specification in the scan mentions it.
      Consumers cannot know it is there, and neither can whoever reviews the
      documented surface for security.

  - id: PHANTOM
    name: Phantom contract
    summary: Promised by a contract, absent from the code
    present: [doc]
    absent: [code]
    needs: [code, doc]
    severity: low
    detail: >-
      A specification advertises this endpoint but nothing in the codebase
      implements it. Usually a route that was removed without the contract
      being updated, or one that was designed and never built. Clients written
      against the document will get a 404.

  - id: ORPHAN
    name: Orphan route
    summary: Taking real requests, absent from the code
    present: [traffic]
    absent: [code]
    needs: [traffic, code]
    needs_observed: [traffic]
    when: { observed_in: traffic }
    severity: high
    detail: >-
      Something out there is calling this endpoint and nothing in the codebase
      accounts for it. Either it is served by a component that was not scanned,
      or it is a route that outlived the code that was supposed to remove it.
      Either way an unaccounted-for endpoint is answering real requests.

  - id: LIVE_UNDOC
    name: Undocumented live endpoint
    summary: Taking real requests, described by no contract
    present: [traffic]
    absent: [doc]
    needs: [traffic, doc]
    needs_observed: [traffic]
    when: { observed_in: traffic }
    severity: high
    detail: >-
      Requests are reaching an endpoint that no specification describes. It is
      in use, so removing it will break somebody, and it is undocumented, so
      whoever reviewed the documented surface never saw it.

  - id: DANGLING
    name: Dangling route
    summary: A routing rule that reaches nothing implemented
    present: [gateway]
    needs: [gateway, code]
    when: { covers_nothing_in: code }
    severity: medium
    detail: >-
      A gateway rule matches paths that no code in the scan serves. Usually a
      backend that moved or was deleted while its route stayed behind. Traffic
      matching it reaches whatever the gateway falls through to.

  - id: DRIFT
    name: Infrastructure drift
    summary: Declared for deployment, missing from the code
    present: [infra]
    needs: [infra, code]
    when: { covers_nothing_in: code }
    severity: medium
    detail: >-
      A function, route or rewrite is declared in infrastructure but nothing in
      the codebase implements what it points at. The declaration and the
      repository disagree about what is being deployed.

  - id: UNEXPOSED
    name: Unexposed endpoint
    summary: Implemented, but no gateway rule reaches it
    present: [code]
    needs: [code, gateway]
    when: { not_covered_by: gateway }
    severity: low
    detail: >-
      No routing rule in the scan reaches this endpoint. That is exactly what
      you want for something internal, and a problem for anything meant to be
      callable -- so this one is worth reading as a question rather than a
      defect. Note that coverage is computed generously: noir reports the path
      a rule matches but not whether it matches as a prefix or exactly, so a
      route reported here is one that nothing plausibly reaches.

  - id: COLD
    name: Cold endpoint
    summary: Implemented, never seen taking a request
    present: [code]
    needs: [code, traffic]
    needs_observed: [traffic]
    when: { not_observed_in: traffic }
    severity: info
    detail: >-
      No captured request reached this endpoint. This says only that nothing
      watched it during the capture, which is why it carries the lowest
      severity -- a quarterly job or an error path is legitimately cold. It is
      useful in aggregate, as a shortlist of code that may no longer be needed.

# Severity moves up or down by whole steps. Adjustments accumulate.
#
# `rules` scopes an adjustment to the findings where it means something. Asking
# whether a PHANTOM endpoint has an authentication check is incoherent -- the
# endpoint does not exist -- so that adjustment names only the rules about code
# that really runs.
#
# Every adjustment here reasons from something noir *found*, never from
# something it failed to find. An earlier version promoted endpoints carrying
# no authentication tag, guarded by a check that such tags existed somewhere in
# the scan. That guard was too weak to hold: Casdoor tags 9 endpoints out of
# 381, which satisfies "somewhere" and says nothing whatever about the other
# 372 -- noir's auth taggers recognise the frameworks they know, and their
# silence is a statement about the tagger, not about the endpoint. Promoting on
# it graded 61 of 139 findings critical.
#
# Rewarding the presence instead needs no guard and makes no inference: an
# endpoint noir could see an authentication check on is genuinely less alarming
# than one it could not.
adjustments:
  - id: pii
    rules: [SHADOW, ORPHAN, LIVE_UNDOC]
    when: { tag: pii }
    shift: +1
    why: an undocumented endpoint that handles personal data

  - id: upload
    rules: [SHADOW, ORPHAN, LIVE_UNDOC]
    when: { tag: file_upload }
    shift: +1
    why: upload paths carry more consequence than reads

  - id: authenticated
    rules: [SHADOW, ORPHAN, LIVE_UNDOC]
    when: { tag_matching: "auth|jwt|oauth|session|login|token" }
    shift: -1
    why: noir found an authentication check on this endpoint

  - id: writes
    rules: [SHADOW, ORPHAN, LIVE_UNDOC]
    when: { method_in: [POST, PUT, PATCH, DELETE, QUERY] }
    shift: +1
    why: changes state rather than reading it
    # The method sits in the row already, so printing the reason beside it adds
    # a line per finding and no information. Kept in `-f json`, where nothing
    # is beside it.
    restates: method

  - id: thin-routing
    when: { thin_routing_view: true }
    shift: -1
    why: >-
      the routing config in this scan reaches almost none of the code, so it is
      probably not the one that fronts it

  - id: near-miss
    when: { near_miss: true }
    shift: -1
    why: >-
      a similar endpoint exists in the other view, so this may be a matching
      failure inside alibi rather than a real gap

# Conditions that keep a finding from being reported at all.
suppress:
  - when: { internal: true }
    why: noir marked this endpoint as internal-only

  - when: { catch_all: true }
    why: >-
      a handler registered at / or /* is the code's own fallback, not an
      endpoint anyone can name -- the mirror of the nginx `location /` that
      coverage already refuses to count

  - when: { non_http: true }
    why: >-
      STOMP and WebSocket verbs share a URL space with HTTP but are not
      described by the same contracts, so their absence is not evidence
